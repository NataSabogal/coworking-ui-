<div class="login-wrapper">
  <div class="login-container">
    <h2 class="login-title">INICIO SESION</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label class="form-label">CUENTA:</label>
        <input type="text" formControlName="username" class="form-input" />
      </div>

      <div class="form-group">
        <label class="form-label">CONTRASEÑA:</label>
        <input type="password" formControlName="password" class="form-input" />
      </div>

      <button type="submit" class="action-button" [disabled]="loginForm.invalid">
        INICIAR
      </button>

      <button type="button" class="action-button register-link" routerLink="/register">
        REGISTRARSE
      </button>
    </form>
  </div>

  <button class="home-button" routerLink="/">
    <mat-icon>home</mat-icon>
  </button>
</div>
